name: ConstEra keyfiyyət yoxlaması

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: constera-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Node.js 22 qur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Yüksək riskli dependency zəifliklərini yoxla
        run: npm audit --audit-level=high

      - name: Kod, API, sayt və build yoxlamalarını işə sal
        run: npm run check

      - name: Chromium quraşdır
        run: npx playwright install --with-deps chromium

      - name: Responsiv layout testlərini işə sal
        run: npm run test:layout

      - name: Brauzer hesabatını saxla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constera-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
