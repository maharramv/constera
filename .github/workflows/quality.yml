name: ConstEra keyfiyyət yoxlaması

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: constera-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v7

      - name: Node.js 22 qur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Yüksək riskli dependency zəifliklərini yoxla
        run: npm audit --audit-level=high

      - name: Kod, API, sayt və build yoxlamalarını işə sal
        run: npm run check

      - name: Chromium quraşdır
        run: npx playwright install --with-deps chromium

      - name: Responsiv layout testlərini işə sal
        run: npm run test:layout

      - name: Buraxılış readiness yoxlaması
        id: launch-readiness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ] && [ -z "${POSTGRES_URL}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL və ya POSTGRES_URL təyin olunmadığı üçün launch readiness check atlandı."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # Adi kod keyfiyyət yoxlaması kommersiya məlumatlarının tamamlanmasını
          # bloklamır; sərt GO-LIVE qapısı launch-readiness-gate.yml-də qalır.
          npm run launch:readiness -- --artifact --artifact-dir=outputs --min-score=0

      - name: Launch readiness nəticələrini saxla
        if: steps.launch-readiness.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: constera-launch-readiness
          path: outputs/launch-readiness-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Brauzer hesabatını saxla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: constera-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
