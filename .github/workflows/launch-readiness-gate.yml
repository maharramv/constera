name: ConstEra launch readiness gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  checks: write

jobs:
  launch-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v7

      - name: Node.js 22 qur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Postgres bağlantısı mövcuddursa buraxılış yoxlamasını işə sal
        id: readiness
        run: |
          if [ -z "${DATABASE_URL}" ] && [ -z "${POSTGRES_URL}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL və ya POSTGRES_URL təyin olunmadığı üçün buraxılış readiness yoxlaması atlandı."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          npm run launch:readiness:go-live -- --artifact
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

      - name: Launch readiness nəticələrini saxla
        if: steps.readiness.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: constera-launch-readiness
          path: outputs/launch-readiness-*
          if-no-files-found: ignore
          retention-days: 14
