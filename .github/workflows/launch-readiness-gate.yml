name: ConstEra launch readiness gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  checks: write

jobs:
  launch-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v7

      - name: Node.js 22 qur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Yüksək riskli dependency zəifliklərini yoxla
        run: npm audit --audit-level=high

      - name: Kataloq media ünvanlarını yoxla
        run: npm run audit:media:online

      - name: Production backup-ını göndər və bərpa yoxlamasını təsdiqlə
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BACKUP_READ_WRITE_TOKEN: ${{ secrets.BACKUP_READ_WRITE_TOKEN }}
        run: |
          if [ -z "${DATABASE_URL}" ] && [ -z "${POSTGRES_URL}" ]; then
            echo "::error::DATABASE_URL və ya POSTGRES_URL təyin olunmayıb; backup yoxlaması bazasız işləyə bilməz."
            exit 1
          fi
          if [ -z "${BACKUP_READ_WRITE_TOKEN}" ]; then
            echo "::error::BACKUP_READ_WRITE_TOKEN təyin olunmayıb; özəl backup kanalı təsdiqlənə bilməz."
            exit 1
          fi
          npm run db:deliver-backup
          npm run db:verify-backup

      - name: Production Postgres ilə buraxılış yoxlamasını işə sal
        run: |
          if [ -z "${DATABASE_URL}" ] && [ -z "${POSTGRES_URL}" ]; then
            echo "::error::DATABASE_URL və ya POSTGRES_URL təyin olunmayıb; buraxılış qapısı bazasız uğurlu sayıla bilməz."
            exit 1
          fi
          npm run launch:readiness:go-live -- --artifact
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BACKUP_READ_WRITE_TOKEN: ${{ secrets.BACKUP_READ_WRITE_TOKEN }}

      - name: Launch readiness nəticələrini saxla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: constera-launch-readiness
          path: outputs/launch-readiness-*
          if-no-files-found: ignore
          retention-days: 14
